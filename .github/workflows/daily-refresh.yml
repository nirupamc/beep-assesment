name: Daily refresh

on:
  schedule:
    # 02:00 UTC = 07:30 IST
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run offline tests
        run: python -m pytest pipeline/tests -q

      # build.py opens its own GitHub issue on source failure or an abort, and
      # always leaves the previous jobs.json in place when it aborts.
      - name: Refresh listings
        id: build
        continue-on-error: true
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline/build.py

      # state.json carries first_seen/closed_at across runs, and the tag cache
      # keeps repeat runs at zero LLM calls, so both are committed too.
      - name: Commit refreshed data
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/jobs.json web/public/sources.json \
                  pipeline/data/state.json pipeline/data/tags_cache.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh listings $(date -u +%Y-%m-%d)"
          for i in 1 2; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed; retrying..."
            sleep 5
          done

      - name: Fail if the refresh aborted
        if: steps.build.outcome == 'failure'
        run: |
          echo "build.py reported a problem; see the issue it opened and the logs above."
          exit 1
